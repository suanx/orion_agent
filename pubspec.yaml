name: orion_agent
description: "Orion Agent - A mobile AI Agent app built with Flutter."
publish_to: "none"
version: 0.2.41+53

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  flutter_markdown: ^0.7.1
  # markdown 语法树 Element 类型：代码块构建器需要显式标注参数类型。
  # flutter_markdown 传递依赖此包，这里显式声明（同 characters 的处理方式）。
  markdown: ">=7.0.0 <8.0.0"
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  # 对话页文件附件 + 备份导入导出：系统 SAF 选择器，无需存储权限。
  file_picker: ^8.1.2
  # 应用内交互式终端：连沙箱内的 sshd（127.0.0.1:8022）。
  # 纯 Dart 实现（dart:io socket），不引入原生代码，不影响 compileSdk。
  dartssh2: ^4.1.0
  speech_to_text: ">=6.6.2 <8.0.0"
  flutter_tts: ">=4.0.0 <5.0.0"
  archive: ^3.6.1
  crypto: ^3.0.3
  # 云端备份/同步的端上加密(AES-256-GCM)。直接复用 dartssh2 已引入的
  # pointycastle 4.x（encrypt 包锁 pointycastle ^3.x，与 dartssh2 互斥）。
  pointycastle: ^4.0.0
  flutter_local_notifications: ^17.2.4
  open_filex: ^4.5.0
  # Edge TTS 合成出的 MP3 文件播放（ExoPlayer/MediaPlayer 封装）。
  # 之前用系统命令行播放器（stagefright/toybox/ffplay），
  # 在现代 Android 上三者全部不可用，导致合成成功也无声。
  audioplayers: ^6.0.0
  # 按字素簇（grapheme cluster）安全截断，避免劈开 emoji / 扩展汉字产生孤立代理项。
  # 该包随 Flutter SDK 一起分发，这里显式声明以免依赖隐式传递依赖。
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mascot.webp
    - assets/images/mascot_dark.webp
    - assets/images/user_img.webp
    # proot 全套不再走 assets：改由 CI 放进 jniLibs，安装后系统解压到
    # nativeLibraryDir（天然可执行、不受 W^X 限制），见 vendor/proot/README.md。

