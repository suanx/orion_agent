name: orion_agent
description: "Orion Agent - A mobile AI Agent app built with Flutter."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  flutter_markdown: ^0.7.1
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  speech_to_text: ">=6.6.2 <8.0.0"
  flutter_tts: ">=4.0.0 <5.0.0"
  archive: ^3.6.1
  crypto: ^3.0.3
  flutter_local_notifications: ^17.2.4
  open_filex: ^4.5.0
  # 按字素簇（grapheme cluster）安全截断，避免劈开 emoji / 扩展汉字产生孤立代理项。
  # 该包随 Flutter SDK 一起分发，这里显式声明以免依赖隐式传递依赖。
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mascot.webp
    - assets/images/mascot_dark.webp
