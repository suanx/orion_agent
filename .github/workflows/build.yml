name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# 发布 terminal-env Release（Debian rootfs）需要写权限
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        # 本地不提交平台目录，在 CI 中按当前 Flutter stable 生成，保证版本一致
        run: flutter create --platforms android --project-name pocket_agent .

      - name: Inject MainActivity with system MethodChannel
        run: cp ci/MainActivity.kt android/app/src/main/kotlin/com/example/pocket_agent/MainActivity.kt

      - name: Lower targetSdk to 28
        # Android 10+ 禁止 app 自带目录内 exec()；终端环境(proot) 需要
        # 在数据目录执行 guest 二进制，Termux 系方案均以 targetSdk 28 规避
        run: |
          sed -i 's/flutter\.targetSdkVersion/28/g' android/app/build.gradle.kts || true
          sed -i 's/flutter\.targetSdkVersion/28/g' android/app/build.gradle || true
          grep -rn "targetSdk" android/app/build.gradle* || true

      - name: Disable release lint check and enable desugaring
        # targetSdk 28 会触发 lintVital 的 ExpiredTargetSdkVersion 致命错误；
        # 应用侧载分发不上架 Play，直接关闭 release lint。
        # flutter_local_notifications 用到 java.time，需要 core library desugaring。
        run: |
          cat >> android/app/build.gradle.kts <<'EOF'

          // targetSdk 28（终端环境 exec 需要）触发 Play 上架 lint，侧载分发故关闭
          android {
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              // flutter_local_notifications 依赖 java.time，必须开启脱糖
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          tail -20 android/app/build.gradle.kts

      - name: Enable edge-to-edge window layout
        # 沉浸式状态栏：CI 用 flutter create 生成的 styles.xml 在部分 Flutter
        # 版本里带 windowOptOutEdgeToEdgeEnforcement（Android 15 起强制
        # edge-to-edge），这里去掉它并显式声明，让内容延伸到状态栏/手势条下方。
        # 注意：用 sed/grep 而非 python heredoc——YAML 里 run 块整体缩进，
        # heredoc 内容会带上前导空格，Python 会报 IndentationError。
        run: |
          set -e
          STYLES=$(find android/app/src/main/res -name styles.xml | head -1)
          echo "styles: $STYLES"
          if [ -z "$STYLES" ]; then
            echo "未找到 styles.xml，跳过（由 Flutter 默认值接管）"
            exit 0
          fi
          echo "--- before ---"; cat "$STYLES"
          # 移除 edge-to-edge 退出开关
          sed -i '/windowOptOutEdgeToEdgeEnforcement/d' "$STYLES"
          # 移除已有的 cutout 声明，随后统一补一条（保证幂等）
          sed -i '/windowLayoutInDisplayCutoutMode/d' "$STYLES"
          # 在 </style> 前插入两条；用 \( *\) 复用原有缩进，避免破坏 XML 排版
          sed -i 's#^\( *\)</style>#\1    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n\1    <item name="android:windowDrawsSystemBarBackgrounds">true</item>\n\1</style>#' "$STYLES"
          echo "--- after ---"; cat "$STYLES"
          grep -q "windowLayoutInDisplayCutoutMode" "$STYLES" \
            || { echo "edge-to-edge 注入失败"; exit 1; }
          if grep -q "windowOptOutEdgeToEdgeEnforcement" "$STYLES"; then
            echo "windowOptOutEdgeToEdgeEnforcement 仍存在"; exit 1
          fi
          echo "edge-to-edge 配置完成"

      - name: Generate app icon from mascot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          SRC=assets/images/mascot.webp
          # 机器人缩小居中，加大白色留白，避免桌面小尺寸下一团黑
          convert "$SRC" -resize 62% -background white -gravity center -extent 1080x1080 /tmp/icon_src.png
          SRC=/tmp/icon_src.png
          RES=android/app/src/main/res
          declare -A FG=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )
          for dir in "${!FG[@]}"; do
            size=${FG[$dir]}
            mkdir -p $RES/mipmap-$dir
            convert "$SRC" -resize ${size}x${size} -background white -flatten $RES/mipmap-$dir/ic_launcher_foreground.png
          done
          declare -A LG=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for dir in "${!LG[@]}"; do
            size=${LG[$dir]}
            convert "$SRC" -resize ${size}x${size} -background white -flatten $RES/mipmap-$dir/ic_launcher.png
          done
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          cat > $RES/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          echo '<?xml version="1.0" encoding="utf-8"?>' > $RES/values/ic_launcher_background.xml
          echo '<resources><color name="ic_launcher_background">#FFFFFF</color></resources>' >> $RES/values/ic_launcher_background.xml
          ls $RES/mipmap-xxxhdpi/

      - name: Bundle proot into jniLibs
        # 终端环境：打包 Termux 构建的 proot（aarch64）及其依赖 libtalloc，
        # 命名为 lib*.so 以便放入 nativeLibraryDir 并获得 exec 权限
        run: |
          set -e
          mkdir -p /tmp/proot-pkg android/app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o /tmp/proot-pkg/proot.deb https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107.96_aarch64.deb
          curl -fsSL -o /tmp/proot-pkg/talloc.deb https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.5.0_aarch64.deb
          dpkg-deb -x /tmp/proot-pkg/proot.deb /tmp/proot-pkg/x1
          dpkg-deb -x /tmp/proot-pkg/talloc.deb /tmp/proot-pkg/x2
          find /tmp/proot-pkg/x1 -type f -name proot -exec cp {} android/app/src/main/jniLibs/arm64-v8a/libproot.so \;
          find /tmp/proot-pkg/x2 -type f -name 'libtalloc.so*' -exec cp {} android/app/src/main/jniLibs/arm64-v8a/libtalloc.so \;
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libproot.so
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Add permissions and notification receivers
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application|' "$MANIFEST"
          # flutter_local_notifications：定时/已展示通知的回调接收器，缺失会在部分 ROM 上崩溃
          sed -i 's|</application>|<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n            </intent-filter>\n        </receiver>\n    </application>|' "$MANIFEST"
          grep -n "INTERNET\|RECORD_AUDIO\|POST_NOTIFICATIONS\|ScheduledNotification" "$MANIFEST"

      - name: Build Debian rootfs and publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view terminal-env >/dev/null 2>&1; then
            echo "terminal-env release 已存在，跳过构建"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo xz-utils
          # --dest-compress 强制 gzip 层（Docker Hub 新镜像可能是 zstd）
          skopeo copy --dest-compress --override-os linux --override-arch arm64 docker://debian:bookworm-slim dir:/tmp/debimg
          LAYER=$(jq -r '.layers[0].digest' /tmp/debimg/manifest.json | cut -d: -f2)
          test -f "/tmp/debimg/$LAYER" || { ls -la /tmp/debimg; exit 1; }
          mkdir -p /tmp/droot
          sudo tar -xzf "/tmp/debimg/$LAYER" -C /tmp/droot
          sudo tar -C /tmp/droot --numeric-owner -cJf /tmp/debian-bookworm-arm64-rootfs.tar.xz .
          ls -la /tmp/debian-bookworm-arm64-rootfs.tar.xz
          gh release create terminal-env /tmp/debian-bookworm-arm64-rootfs.tar.xz \
            --title "Terminal environment bootstrap" \
            --notes "Debian bookworm arm64 rootfs for the in-app terminal environment"

      - name: Pub get
        run: flutter pub get

      - name: Drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # 分析结果同时以 annotation 形式暴露，便于无 repo 管理员权限时排查
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            grep -E '^\s*(error|warning|info)' /tmp/analyze.txt | head -60 | \
              awk '{printf "::error ::%s\n", $0}'
            echo "::error ::flutter analyze 退出码 $RC"
          fi
          echo "--- error 行汇总 ---"
          grep -c 'error •' /tmp/analyze.txt || true
          exit "$RC"

      - name: Test
        # 失败的测试明细以 annotation 形式暴露，便于无 repo 管理员权限时排查
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/test.txt
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            echo "::error ::flutter test 退出码 $RC"
            # 以每个 [E] 失败标记为锚点，输出其前后各 20 行，
            # 这样 print 调试输出、Expected/Actual、用例名都能一并拿到。
            awk '
              /\[E\]/ { hit[NR]=1 }
              { lines[NR]=$0 }
              END {
                for (n in hit) {
                  lo = n-20; if (lo<1) lo=1
                  hi = n+20
                  printf "::error ::===== 失败用例附近 (行 %d) =====\n", n
                  for (i=lo; i<=hi; i++) if (i in lines) printf "::error ::%s\n", lines[i]
                }
              }' /tmp/test.txt
            echo "--- 末尾 40 行 ---"
            tail -40 /tmp/test.txt | awk '{printf "::error ::%s\n", $0}'
          fi
          exit "$RC"

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
