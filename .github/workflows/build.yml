name: build

on:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      obfuscate:
        description: '手动测试构建（产物仅存 artifact 不发 Release；混淆自 v0.2.30 起已默认开启）'
        type: boolean
        required: false
        default: false

# 发布 terminal-env Release（Debian rootfs）需要写权限
permissions:
  contents: write

# 同分支的 run 互斥：新 push 自动取消上一个没跑完的 run。
# main/beta 共用一个 workflow，连续推送时旧的 run 不取消会白排队、
# 还可能与新 run 抢 hosted runner（2026-10-06 曾连续两次
# "not acquired by Runner of type hosted"）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        # 本地不提交平台目录，在 CI 中按当前 Flutter stable 生成，保证版本一致
        run: flutter create --platforms android --project-name orion_agent .

      - name: Sync kAppVersion from pubspec
        # 版本号单一事实来源（§11.17/§11.21 的根治）：应用自报版本的
        # kAppVersion 是手写常量，历史上两次因「只升 pubspec 忘升常量」
        # 导致装了新版仍反复弹更新提示的循环。这里在 CI 里用 pubspec 的
        # version 强制覆写源码常量——本地忘了同步，构建产物也会被纠正；
        # 自检不匹配直接 fail，不会带病出包。
        run: |
          set -e
          VN=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          F=lib/ui/about_screen.dart
          grep -q "const String kAppVersion" "$F" || {
            echo "::error ::未找到 kAppVersion 常量（about_screen.dart 结构可能已变化）"
            exit 1
          }
          sed -i "s/const String kAppVersion = '[^']*';/const String kAppVersion = '$VN';/" "$F"
          ACTUAL=$(grep -o "const String kAppVersion = '[^']*'" "$F" | sed "s/.*= '\([^']*\)'.*/\1/")
          if [ "$ACTUAL" != "$VN" ]; then
            echo "::error ::kAppVersion 同步失败（$ACTUAL != $VN）"
            exit 1
          fi
          echo "kAppVersion 已从 pubspec 同步为 $VN"

      - name: Inject MainActivity with system MethodChannel
        run: |
          set -e
          KT_DIR=android/app/src/main/kotlin/com/orionagent/app
          mkdir -p "$KT_DIR"
          cp ci/MainActivity.kt "$KT_DIR/MainActivity.kt"
          ls "$KT_DIR"

      - name: Set applicationId to com.orionagent.app
        # 包名单一改写点（v0.2.33 起弃用 com.example.orion_agent）：
        # flutter create 模板固定生成 com.example.<project>，这里统一
        # 改写 applicationId 与 namespace，并自检无残留——漏改任何一处
        # 都会在 Kotlin 编译或 manifest 合并期爆出难懂的 R 类/类名错误。
        # ⚠️ 包名变更 = 新应用身份：旧版无法覆盖安装，需卸载重装
        # （数据不迁移，可用「我的 → 备份与恢复」先导出再导入）。
        run: |
          set -e
          F=android/app/build.gradle.kts
          sed -i 's/namespace = "com.example.orion_agent"/namespace = "com.orionagent.app"/' "$F"
          sed -i 's/applicationId = "com.example.orion_agent"/applicationId = "com.orionagent.app"/' "$F"
          grep -n 'namespace\|applicationId' "$F"
          if grep -q "com.example.orion_agent" "$F"; then
            echo "::error ::build.gradle.kts 仍残留 com.example.orion_agent"
            exit 1
          fi
          echo "applicationId/namespace 已改为 com.orionagent.app"

      - name: Lower targetSdk to 28
        # Android 10+ 禁止 app 自带目录内 exec()；终端环境(proot) 需要
        # 在数据目录执行 guest 二进制，Termux 系方案均以 targetSdk 28 规避
        run: |
          sed -i 's/flutter\.targetSdkVersion/28/g' android/app/build.gradle.kts || true
          sed -i 's/flutter\.targetSdkVersion/28/g' android/app/build.gradle || true
          grep -rn "targetSdk" android/app/build.gradle* || true

      - name: Disable release lint check and enable desugaring
        # targetSdk 28 会触发 lintVital 的 ExpiredTargetSdkVersion 致命错误；
        # 应用侧载分发不上架 Play，直接关闭 release lint。
        # flutter_local_notifications 用到 java.time，需要 core library desugaring。
        #
        # 注意：这里【追加】第二个 android {} 块是有意为之，不是重复定义。
        # Kotlin DSL 允许多个同名配置块，Gradle 会把它们合并到同一个 android 容器，
        # 模板里已有的 compileOptions 与这里注入的会叠加生效。不要"顺手合并"，
        # 也不要改成改写模板——那正是之前反复引入构建失败的原因。
        run: |
          cat >> android/app/build.gradle.kts <<'EOF'

          // targetSdk 28（终端环境 exec 需要）触发 Play 上架 lint，侧载分发故关闭
          android {
              // file_picker 的传递依赖 flutter_plugin_android_lifecycle 2.0.2x
              // 要求编译目标 ≥ Android API 36，不满足则 checkReleaseAarMetadata
              // 直接失败（v0.2.16-beta 实测）。compileSdk 只影响编译期 API，
              // targetSdk 仍为 28（终端 exec 需要），互不影响。
              compileSdk = 36
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              // proot 五件套必须解压到 nativeLibraryDir 才能被 exec（见
              // vendor/proot/README.md）。AGP 默认 false 时不落盘、直接从
              // APK 映射，nativeLibraryDir 会是空目录。代价是安装后多占
              // 一份解压副本（五件套约 300KB），可接受。
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
              // flutter_local_notifications 依赖 java.time，必须开启脱糖。
              // Java 与 Kotlin 的 jvmTarget 必须一致：Kotlin 默认输出 17，
              // 若只把 Java 设成 11，assembleRelease 会因 target 不一致直接失败。
              // 因此两边统一为 17（AGP 8.x 原生支持）。
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
          tail -25 android/app/build.gradle.kts
          # 自检：注入体若含 shell 注释（#）或结构不配平，Gradle 后面会报很难懂的
          # "Expecting an element"。这里提前失败并给出可读信息。
          if grep -nE '^[[:space:]]*#' android/app/build.gradle.kts; then
            echo "::error ::build.gradle.kts 出现 shell 风格 # 注释，Gradle 无法解析"
            exit 1
          fi
          python3 - <<'PYCHK'
          import re, sys
          src = open('android/app/build.gradle.kts', encoding='utf-8').read()
          # 计数前先剥掉字符串与注释，否则 "com.android.tools:desugar_jdk_libs:2.1.4"
          # 之类内容里的括号/引号会让朴素计数产生假阳性。
          code = re.sub(r'/\*[\s\S]*?\*/', '', src)          # 块注释
          code = re.sub(r'//[^\n]*', '', code)                # 行注释
          code = re.sub(r'"""[\s\S]*?"""', '""', code)         # 三引号字符串
          code = re.sub(r'"(?:\\.|[^"\\\n])*"', '""', code)     # 普通字符串
          if code.count('{') != code.count('}'):
              print('::error ::花括号不配平 { =%d } =%d' % (code.count('{'), code.count('}')))
              sys.exit(1)
          if code.count('"') % 2 != 0:
              print('::error ::双引号不配对，heredoc 可能被提前截断')
              sys.exit(1)
          print('注入自检通过')
          PYCHK

      - name: Verify Kotlin jvmTarget alignment (no deprecated kotlinOptions)
        # flutter create 生成的模板【已自带】kotlin { compilerOptions { jvmTarget = JVM_17 } }，
        # 与 compileOptions 的 VERSION_17 一致，Gradle 两侧 jvmTarget 校验本来就能通过。
        #
        # 历史教训：曾在这里注入 kotlinOptions { jvmTarget = ... } 想「显式对齐」，
        # 但 Kotlin 2.x 已废弃该 DSL，脚本编译阶段就直接失败：
        #   Script compilation errors:
        #   e: ...build.gradle.kts:12:9: 'var jvmTarget: String' is deprecated.
        #     Please migrate to the compilerOptions DSL.
        # 于是白等一轮 CI 才定位到。故改为只校验、不注入。
        run: |
          set -e
          F=android/app/build.gradle.kts
          [ -f "$F" ] || F=android/app/build.gradle
          echo "检查文件: $F"
          grep -nE 'compileOptions|jvmTarget|sourceCompatibility|targetCompatibility|kotlinOptions|compilerOptions' "$F" || true
          # kotlinOptions 是 Kotlin 2.x 废弃的 DSL，一旦出现必然编译失败
          if grep -q "kotlinOptions" "$F"; then
            echo "::error ::检测到已废弃的 kotlinOptions DSL，Kotlin 2.x 下会导致脚本编译失败"
            exit 1
          fi
          # 模板若结构变化导致 compilerOptions 缺失，Java/Kotlin 两侧 jvmTarget
          # 就无法保证一致，立即报错而不是等 Gradle 抛晦涩的不一致错误。
          grep -q "compilerOptions" "$F" || {
            echo "::error ::未找到 kotlin compilerOptions（Flutter 模板结构可能已变化）"
            exit 1
          }
          grep -qE 'jvmTarget\s*=\s*.*(JVM_17|VERSION_17)' "$F" || {
            echo "::error ::Kotlin jvmTarget 未钉到 17"
            exit 1
          }
          grep -q "VERSION_17" "$F" || {
            echo "::error ::compileOptions 未钉到 VERSION_17"
            exit 1
          }
          echo "Kotlin/Java jvmTarget 均为 17，校验通过"

      - name: Enable edge-to-edge window layout
        # 沉浸式状态栏：内容延伸到状态栏/手势条下方，背景由 Flutter 绘制。
        #
        # ⚠️ 不要加 android:windowDrawsSystemBarBackgrounds=true。
        # 它会把系统栏背景的绘制权交给 Android 框架，框架用主题默认的
        # 不透明黑（windowBackground/statusBarColor 的默认值）画状态栏，
        # Flutter 里 SystemChrome 设的 statusBarColor: transparent 被架空，
        # 表现为「状态栏一条黑边」—— 即使 Flutter 侧已经用 Container
        # 涂了状态栏区域也盖不住，因为系统那层画在 Flutter 之上。
        #
        # 正确做法：系统栏保持透明（edge-to-edge 默认行为），
        # 让 Flutter 的 Scaffold/Container 露出来当背景。
        #
        # 注意：用 sed/grep 而非 python heredoc——YAML 里 run 块整体缩进，
        # heredoc 内容会带上前导空格，Python 会报 IndentationError。
        run: |
          set -e
          # 处理**全部** styles.xml：项目通常有 values/ 与 values-night/ 两份，
          # 只改一个（原先的 head -1）会漏掉深色模式那份，
          # 表现为「浅色正常、深色模式下状态栏又黑回来了」。
          mapfile -t STYLES < <(find android/app/src/main/res -name styles.xml)
          if [ ${#STYLES[@]} -eq 0 ]; then
            echo "未找到 styles.xml，跳过（由 Flutter 默认值接管）"
            exit 0
          fi
          echo "找到 ${#STYLES[@]} 个 styles.xml"
          for STYLES in "${STYLES[@]}"; do
            echo "=== 处理 $STYLES ==="
            echo "--- before ---"; cat "$STYLES"
            # 移除 edge-to-edge 退出开关
            sed -i '/windowOptOutEdgeToEdgeEnforcement/d' "$STYLES"
            # 移除已有的 cutout / 系统栏背景权声明，随后统一补（保证幂等）
            sed -i '/windowLayoutInDisplayCutoutMode/d' "$STYLES"
            sed -i '/windowDrawsSystemBarBackgrounds/d' "$STYLES"
            # 显式声明系统栏透明：Android 15 之前靠这个生效，
            # 15 之后被强制 edge-to-edge 覆盖，但写出来无害且意图明确。
            sed -i 's#^\( *\)</style>#\1    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n\1    <item name="android:statusBarColor">@android:color/transparent</item>\n\1    <item name="android:navigationBarColor">@android:color/transparent</item>\n\1</style>#' "$STYLES"
            echo "--- after ---"; cat "$STYLES"
            # 校验：cutout 已加、退出开关已删、**系统栏背景权没有回到框架手里**
            grep -q "windowLayoutInDisplayCutoutMode" "$STYLES" \
              || { echo "$STYLES: cutout 注入失败"; exit 1; }
            if grep -q "windowOptOutEdgeToEdgeEnforcement" "$STYLES"; then
              echo "$STYLES: windowOptOutEdgeToEdgeEnforcement 仍存在"; exit 1
            fi
            if grep -q "windowDrawsSystemBarBackgrounds" "$STYLES"; then
              echo "$STYLES: windowDrawsSystemBarBackgrounds 仍存在（会让状态栏变黑）"; exit 1
            fi
            grep -q "android:statusBarColor" "$STYLES" \
              || { echo "$STYLES: statusBarColor 未注入"; exit 1; }
          done
          echo "edge-to-edge 配置完成（${#STYLES[@]} 个文件）"

      - name: Generate app icon from mascot
        timeout-minutes: 10   # apt 偶发挂起等慢源，卡死 6 小时才被 job 默认超时杀（run #119 实证）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          SRC=assets/images/mascot.webp
          # 机器人缩小居中，加大白色留白，避免桌面小尺寸下一团黑
          convert "$SRC" -resize 62% -background white -gravity center -extent 1080x1080 /tmp/icon_src.png
          SRC=/tmp/icon_src.png
          RES=android/app/src/main/res
          declare -A FG=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )
          for dir in "${!FG[@]}"; do
            size=${FG[$dir]}
            mkdir -p $RES/mipmap-$dir
            convert "$SRC" -resize ${size}x${size} -background white -flatten $RES/mipmap-$dir/ic_launcher_foreground.png
          done
          declare -A LG=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for dir in "${!LG[@]}"; do
            size=${LG[$dir]}
            convert "$SRC" -resize ${size}x${size} -background white -flatten $RES/mipmap-$dir/ic_launcher.png
          done
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          cat > $RES/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          echo '<?xml version="1.0" encoding="utf-8"?>' > $RES/values/ic_launcher_background.xml
          echo '<resources><color name="ic_launcher_background">#FFFFFF</color></resources>' >> $RES/values/ic_launcher_background.xml
          ls $RES/mipmap-xxxhdpi/

      - name: Install proot suite into jniLibs
        # 终端环境：proot 五件套（主程序 + 双 loader + 两个依赖库）已在
        # vendor/proot/arm64-v8a（来源与取舍见 vendor/proot/README.md）。
        #
        # 模式参考 jieapi/aicode（在真实设备上验证过的产品级组合）：
        # 以 lib*.so 命名放进 jniLibs，配合 build.gradle.kts 的
        # packaging.jniLibs.useLegacyPackaging=true，安装后由系统解压到
        # nativeLibraryDir——系统管理的目录，W^X 限制不拦 exec，无需 chmod。
        #
        # ⚠️ 历史教训：此前走「assets 复制到 appSupport + chmod」，在
        # 小米 HyperOS 上 proot 全部实验组 exit=127（设备侧拦截了
        # app 数据目录里的 exec）。jniLibs 方案绕开该问题。
        #
        # 注意 vendored proot 的 DT_NEEDED 是 libtalloc.so（无 .2 后缀），
        # 库文件名必须与之一致，改名即链接失败。
        run: |
          set -e
          LIBS=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$LIBS"
          cp vendor/proot/arm64-v8a/*.so "$LIBS/"
          for f in libproot.so libproot-loader.so libproot-loader32.so libtalloc.so libandroid-shmem.so; do
            if [ ! -s "$LIBS/$f" ]; then
              echo "jniLibs 缺失或为空: $f"
              exit 1
            fi
            magic=$(head -c 4 "$LIBS/$f" | od -An -tx1 | tr -d ' \n')
            if [ "$magic" != "7f454c46" ]; then
              echo "不是 ELF（magic=$magic）: $f"
              exit 1
            fi
            echo "OK $f: $(stat -c%s "$LIBS/$f") 字节"
          done
          echo "proot 五件套已进入 jniLibs，全部为合法 ELF"

      - name: Add permissions and notification receivers
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application|' "$MANIFEST"
          # flutter_local_notifications：定时/已展示通知的回调接收器，缺失会在部分 ROM 上崩溃
          sed -i 's|</application>|<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n            </intent-filter>\n        </receiver>\n        <service android:name="com.orionagent.app.AgentAccessibilityService" android:exported="false" android:label="Orion Agent 无障碍服务" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">\n            <intent-filter>\n                <action android:name="android.accessibilityservice.AccessibilityService"/>\n            </intent-filter>\n            <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/>\n        </service>\n    </application>|' "$MANIFEST"
          grep -n "INTERNET\|RECORD_AUDIO\|POST_NOTIFICATIONS\|ScheduledNotification\|AgentAccessibilityService" "$MANIFEST"
          # 桌面（启动器）显示名：flutter create 默认用项目名 orion_agent，改为正式名
          sed -i 's|android:label="orion_agent"|android:label="Orion Agent"|' "$MANIFEST"
          grep -n 'android:label' "$MANIFEST"

      - name: Add accessibility service files
        # 应用授权页的「无障碍权限」需要真实存在的服务才可授予。
        # AgentAccessibilityService 目前是最小实现（只收事件不做动作），
        # 为后续 AI 操作手机类能力预留入口（见 ci/AgentAccessibilityService.kt）。
        run: |
          set -e
          KT_DIR=android/app/src/main/kotlin/com/orionagent/app
          cp ci/AgentAccessibilityService.kt "$KT_DIR/AgentAccessibilityService.kt"
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          cat > android/app/src/main/res/xml/accessibility_service_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_service_desc" />
          XML
          # description 必须是字符串资源；strings.xml 若已存在只追加（幂等）
          if [ ! -f android/app/src/main/res/values/strings.xml ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="accessibility_service_desc">用于 AI 读取屏幕内容并执行操作（当前仅注册，暂不采集数据）</string>\n</resources>\n' > android/app/src/main/res/values/strings.xml
          elif ! grep -q accessibility_service_desc android/app/src/main/res/values/strings.xml; then
            sed -i 's|</resources>|    <string name="accessibility_service_desc">用于 AI 读取屏幕内容并执行操作（当前仅注册，暂不采集数据）</string>\n</resources>|' android/app/src/main/res/values/strings.xml
          fi
          ls "$KT_DIR" android/app/src/main/res/xml

      - name: Build Debian rootfs and publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # release 查询带 3 次重试：偶发 API 抖动会让 view 误报「不存在」，
          # 随后走 9 分钟全量构建、最后 create 撞「tag 已存在」而失败
          # （run#33 实际发生）。查询成功即跳过。
          FOUND=0
          for i in 1 2 3; do
            if gh release view terminal-env >/dev/null 2>&1; then FOUND=1; break; fi
            sleep 3
          done
          if [ "$FOUND" = "1" ]; then
            echo "terminal-env release 已存在，跳过构建"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo xz-utils
          # --dest-compress 强制 gzip 层（Docker Hub 新镜像可能是 zstd）
          skopeo copy --dest-compress --override-os linux --override-arch arm64 docker://debian:bookworm-slim dir:/tmp/debimg
          LAYER=$(jq -r '.layers[0].digest' /tmp/debimg/manifest.json | cut -d: -f2)
          test -f "/tmp/debimg/$LAYER" || { ls -la /tmp/debimg; exit 1; }
          mkdir -p /tmp/droot
          sudo tar -xzf "/tmp/debimg/$LAYER" -C /tmp/droot
          sudo tar -C /tmp/droot --numeric-owner -cJf /tmp/debian-bookworm-arm64-rootfs.tar.xz .
          ls -la /tmp/debian-bookworm-arm64-rootfs.tar.xz
          # 发布兜底：若构建期间 release 被并发 run 创建，改为向已有
          # release 覆盖上传，避免 create 因 tag 已存在而整体失败
          gh release upload terminal-env /tmp/debian-bookworm-arm64-rootfs.tar.xz --clobber 2>/dev/null || \
            gh release create terminal-env /tmp/debian-bookworm-arm64-rootfs.tar.xz \
              --title "Terminal environment bootstrap" \
              --notes "Debian bookworm arm64 rootfs for the in-app terminal environment"

      - name: Pub get
        run: flutter pub get

      - name: Track pubspec.lock
        # 评估项 M1：lock 入库，构建可复现。本机无 Flutter SDK，lock 由
        # CI 首次生成并自动回提交到当前分支；此后 pub get 每次发现
        # lock 漂移（依赖升级/Flutter stable 变化）也回提交，隐式升级
        # 在 git 历史里显式可见、可回溯。回提交只加 lock 文件，
        # 本次构建产物对应 GITHUB_SHA，差异仅此一个文件，可接受。
        run: |
          set -e
          if [ ! -s pubspec.lock ]; then
            echo "::error ::pub get 后 pubspec.lock 不存在（异常）"; exit 1
          fi
          if git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1 \
             && git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock 已跟踪且无漂移"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: 同步 pubspec.lock（CI 自动回提交，保持依赖解析可复现）"
          git push origin "HEAD:$GITHUB_REF"
          echo "pubspec.lock 已回提交到 $GITHUB_REF"

      - name: Drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # 分析结果同时以 annotation + job summary 两种形式暴露：
        # annotation 需要 checks:write 权限且日志接口要 repo scope，
        # summary 只要默认 GITHUB_TOKEN，任何人都能在页面上直接看到。
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            {
              echo "### flutter analyze 失败（退出码 $RC）"
              echo '```'
              grep -E '(error|warning) •' /tmp/analyze.txt | head -60 || echo '(未匹配到 error/warning 行)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^\s*(error|warning|info)' /tmp/analyze.txt | head -60 | \
              awk '{printf "::error ::%s\n", $0}'
            echo "::error ::flutter analyze 退出码 $RC"
          fi
          echo "--- error 行汇总 ---"
          grep -c 'error •' /tmp/analyze.txt || true
          exit "$RC"

      - name: Test
        # 失败的测试明细以 annotation 形式暴露，便于无 repo 管理员权限时排查
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/test.txt
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            echo "::error ::flutter test 退出码 $RC"
            # 只输出以 [E] 结尾的失败用例名，以及其后的 Expected/Actual/Which/reason
            # （测试里用 reason: 把真实字符串带出来，所以这里足够定位）
            grep -nE '\[E\]$|^\s*(Expected|Actual|Which|.*s=)' /tmp/test.txt \
              | head -40 | awk '{printf "::error ::%s\n", $0}'
            echo "::error ::--- 汇总 ---"
            tail -12 /tmp/test.txt | awk '{printf "::error ::%s\n", $0}'
          fi
          exit "$RC"

      - name: Inject release signing config
        # 正式版签名：keystore/orion-release.p12（PKCS12，别名 orion）。
        # ⚠️ 每次发布必须使用同一签名，否则用户无法覆盖安装升级。
        # 该文件随仓库分发（密码仅用于本地加密 keystore，应用签名的
        # 唯一性由私钥本身保证；公开仓库场景下这是个人项目的务实取舍，
        # 后续可改用 GitHub Secrets 覆盖密码）。
        run: |
          test -s keystore/orion-release.p12 || { echo "keystore/orion-release.p12 缺失"; exit 1; }
          # R8 混淆规则（防反编译第二层）。CI 每次 flutter create 全新生成
          # 平台目录，proguard-rules.pro 不会存在，必须在这里落盘。
          cat > android/app/proguard-rules.pro <<'EOF'
          # Flutter 引擎与插件基础 keep（R8 开启后的必备规则）
          -keep class io.flutter.** { *; }
          -dontwarn io.flutter.embedding.**
          # 本项目原生入口（MethodChannel 宿主，见 ci/MainActivity.kt）。
          # manifest 声明的 Activity 由 aapt2 自动 keep，这里再双保险。
          -keep class com.orionagent.app.MainActivity { *; }
          -keep class * extends io.flutter.embedding.android.FlutterActivity { *; }
          EOF
          cat >> android/app/build.gradle.kts <<'EOF'

          // 正式版签名（追加块，Kotlin DSL 多块合并）。密码优先取
          // 环境变量 ORION_KS_PASS（GitHub Secrets），未配置用内置默认值。
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("../../keystore/orion-release.p12")
                      storePassword = System.getenv("ORION_KS_PASS") ?: "orion-ks-2026-secure"
                      keyAlias = "orion"
                      keyPassword = System.getenv("ORION_KS_PASS") ?: "orion-ks-2026-secure"
                      storeType = "PKCS12"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      // v0.2.2 首开 R8（isMinifyEnabled/isShrinkResources）：
                      // APK 取证显示 R8 实际未压缩/未混淆任何类（dex 内插件
                      // 类名原样、arsc 无变化），却伴随装机白屏，已回退。
                      // 未来若重新启用：先真机验证 + 用 mapping.txt 确认
                      // 混淆确实生效，规则文件见本步骤落盘的 proguard-rules.pro。
                  }
              }
          }
          EOF
          tail -30 android/app/build.gradle.kts

      - name: Raise plugin subprojects compileSdk to 36
        # file_picker 的传递依赖 flutter_plugin_android_lifecycle 2.0.2x，
        # 其 AAR metadata 要求使用方 compileSdk ≥ 36；而 Flutter 插件
        # 子模块默认按 flutter.compileSdkVersion(34) 编译 →
        # :file_picker:checkReleaseAarMetadata 直接失败（v0.2.16-beta 实测）。
        #
        # 两个被否决的方案（省得再踩）：
        # 1. root build.gradle.kts 追加 subprojects{afterEvaluate{...}} →
        #    报 "project is already evaluated"（root 评估时机晚于子项目）
        # 2. dependency_overrides 钉 lifecycle 2.0.19 → 用 v1 embedding
        #    API，在 Flutter 3.47 下 javac 编译失败
        #
        # 本方案：pub get 之后直接把 pub-cache 里所有插件构建脚本的
        # flutter.compileSdkVersion 替换为字面量 36（app 模块已单独设 36）。
        # 只影响编译期 API 级别，targetSdk 仍为 28。
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"
          COUNT=0
          for f in $(find "$CACHE" -maxdepth 3 -path "*/android/build.gradle*" 2>/dev/null); do
            # 两种写法都覆盖：
            #  - 老模板：compileSdk flutter.compileSdkVersion（→36）
            #  - 新模板：compileSdk = 34 / compileSdkVersion 34（字面量→36）
            sed -i -E 's/(compileSdk(Value)?[ ]*=?[ ]*)3[0-5]/\136/g;
                       s/flutter\.compileSdkVersion/36/g' "$f"
            COUNT=$((COUNT+1))
          done
          echo "已处理 $COUNT 个插件构建脚本"
          grep -rn "compileSdk" "$CACHE/file_picker-"*/android/build.gradle* 2>/dev/null | head -5 || true

      - name: Build APK
        # 同样把失败明细以 annotation 暴露（job log 无权限查看）
        # versionName 取自 pubspec（每次发版手动递增），
        # versionCode 用 workflow run number（严格单调递增，满足覆盖安装）
        run: |
          set +e
          VN=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "versionName=$VN versionCode=$GITHUB_RUN_NUMBER"
          # ⚠️ v0.2.2 曾启用 --obfuscate --split-debug-info，装机白屏（启动失败）。
          # APK 取证：R8 未生效（dex 内插件类名原样）、libapp.so 缩 1.4MB（混淆生效）
          # → 判定 --obfuscate 为白屏主因，已回退。重新引入走分步协议（§11.18）：
          # 第一步 = 手动触发（inputs.obfuscate=true）出【混淆测试版】，artifact
          #   命名 orion-agent-apk-test，不发布 Release；真机验证启动/对话/工具调用
          #   全部正常后，第二步才把正式发布构建切到混淆。
          # 当时导致白屏的两个 release-only 崩溃（Markdown 样式表空断言、
          # AnimatedContainer clip 无 decoration）已在 v0.2.5/v0.2.6 修复，
          # 且发布版有红色错误卡片兜底（异常可见），本次重试有判据。
          # 分步协议第二步完成（2026-10-06，v0.2.30 起）：beta 渠道预发布
          # 版本自 2026-10-06 起常态混淆、真机验证稳定，main 正式构建
          # 同步切换为常态混淆；第三步 R8/minify 仍单独评估。
          OBF="--obfuscate --split-debug-info=build/app/symbols"
          echo "混淆构建：$OBF"
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name="$VN" --build-number="$GITHUB_RUN_NUMBER" \
            $OBF 2>&1 \
            | tee /tmp/build.txt
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            echo "::error ::flutter build apk 退出码 $RC"
            # Kotlin/Gradle 编译错误的关键行：e:/w: 前缀、What went wrong、
            # Execution failed、Caused by 等。
            # ⚠️ 这里必须用 shell 的 `#`，不能用 `//` —— 后者在 sh 里不是注释，
            # 会被当成命令去执行（`//` 是个目录，报 "Is a directory"），
            # 失败信息会被淹没在无意义的报错里。
            grep -nE '^(e|w): |error:|^e: |What went wrong|Execution failed|Caused by|FAILURE:|\* Try|Compilation error' /tmp/build.txt \
              | head -50 | awk '{printf "::error ::%s\n", $0}'
            echo "::error ::--- What went wrong 段落 ---"
            awk '/What went wrong/{f=1} f{print; n++} n>25{exit}' /tmp/build.txt \
              | awk '{printf "::error ::%s\n", $0}'
          fi
          exit "$RC"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # 混淆测试版用独立 artifact 名，避免与正式包混淆误装
          name: ${{ inputs.obfuscate == true && 'orion-agent-apk-test' || 'orion-agent-apk' }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload obfuscation symbols
        # 混淆产物的符号表（--split-debug-info 输出）：崩溃堆栈用
        # `flutter symbolize -d <libapp.so> -i <trace.txt> -o out.txt` 还原。
        # 必须与 APK 同 run 归档留档，缺失则该版崩溃无法解析。
        # 分步协议第二步起 main/beta 均常态混淆，符号表一律归档。
        uses: actions/upload-artifact@v4
        with:
          name: orion-agent-symbols
          path: build/app/symbols/

      - name: Publish to GitHub Releases
        # 正式发布：APK 上传到 Releases（tag = 版本号），更新说明取
        # 仓库根的 RELEASE_NOTES.md 顶部**当前版本段落**（整文件贴会把
        # 历史版本说明全部带进每个 Release 正文）。
        # 应用内「关于 → 检查更新」读取的就是这里的 latest release。
        # 仅 push 触发时发布——手动触发的混淆测试版【不发 Release】，
        # 避免 test 包进入应用内更新通道（关于页 latest release 校验）。
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VN=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          TAG="v$VN"
          # beta 分支 → 预发布；main 分支 → 正式发布。
          # 两个分支共用这一个 workflow（push.branches 同时列 main/beta），
          # 所以发布口径必须靠分支判断，不能写死。
          IS_BETA=false
          if [ "$GITHUB_REF" = "refs/heads/beta" ]; then IS_BETA=true; fi
          PRERELEASE_FLAG="--prerelease=false"
          TITLE="Orion Agent v$VN"
          if [ "$IS_BETA" = "true" ]; then
            PRERELEASE_FLAG="--prerelease=true"
            TITLE="Orion Agent v$VN (Beta)"
          fi
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK" || { echo "APK 不存在"; exit 1; }
          test -s RELEASE_NOTES.md || { echo "RELEASE_NOTES.md 缺失"; exit 1; }
          echo "发布 $TAG（versionCode=$GITHUB_RUN_NUMBER, beta=$IS_BETA）"
          # 提取顶部当前版本段落（从含 vX.Y.Z 的 "# Orion Agent" 标题
          # 到下一个 "# Orion Agent" 标题或文件结束）；提取不到就退回整文件。
          awk -v ver="$TAG" 'BEGIN{p=0} /^# Orion Agent /{if(p)exit; if(index($0,ver)>0)p=1} p' \
            RELEASE_NOTES.md > /tmp/rel_notes.md
          test -s /tmp/rel_notes.md || cp RELEASE_NOTES.md /tmp/rel_notes.md
          # 先重命名再上传：gh 的 filepath#label 重命名在部分版本不生效
          cp "$APK" "orion-agent-v$VN.apk"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "orion-agent-v$VN.apk" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file /tmp/rel_notes.md --title "$TITLE" \
              $PRERELEASE_FLAG -R "$GITHUB_REPOSITORY"
            # 清理历史遗留的未重命名资产
            gh release delete-asset "$TAG" app-release.apk -y -R "$GITHUB_REPOSITORY" || true
          else
            # --target 必须显式给本次构建的 commit：gh 对不存在的 tag 会
            # 默认从【默认分支】(main) 打标，导致 beta 发布物的 tag 指向
            # main 提交（v0.2.18-beta 实测踩过）。
            gh release create "$TAG" "orion-agent-v$VN.apk" \
              -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file /tmp/rel_notes.md \
              $PRERELEASE_FLAG
          fi
          echo "已发布 $TAG（beta=$IS_BETA）"

      # ---- R2 分发链（仅 main push 的正式发布；beta 走 GitHub 预发布通道）----
      #
      # 三步顺序有硬约束，不能调换：
      #   ① 传 APK（版本化文件名）→ ② 校验远端大小一致 → ③ 最后写
      #   latest.json 更新清单。清单是「原子切换点」：应用侧只认这个
      #   固定地址（lib/services/update_service.dart 的 _r2ManifestUrl），
      #   清单一写入，所有用户的下一次更新检查立刻指向新 APK。
      #   若先写清单后传 APK，存在一个窗口期：清单已指向尚不存在的
      #   文件，用户会下载 404。APK 校验失败则直接 fail，清单保持
      #   指向旧版（用户继续收到旧版更新，不会拿到坏包）。
      #
      # 配置项（Repo Settings → Secrets and variables → Actions）：
      #   R2_ENDPOINT        https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      #                      （Cloudflare 控制台 R2 概览页右侧可见）
      #   R2_ACCESS_KEY_ID   R2 API Token 生成的 S3 凭证（只读+写该 bucket）
      #   R2_SECRET_ACCESS_KEY  同上
      #   R2_BUCKET          bucket 名（rootfs 与 APK 可同桶不同前缀）
      #   R2_PUBLIC_BASE     自定义域名根，如 https://gr.suen.us.ci
      #                      （需在 R2 bucket 的 Public Development URL /
      #                       自定义域中绑定；国内可达性依赖该域名）
      #
      # R2 对象布局：
      #   orion/orion-agent-v<X.Y.Z>.apk   各正式版本 APK（版本化文件名）
      #   orion/latest.json                更新清单（version/apkUrl/notes/
      #                                    buildNumber/sha256）
      - name: Upload APK to R2
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK" || { echo "APK 不存在"; exit 1; }
          VN=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          KEY="orion/orion-agent-v$VN.apk"
          echo "上传 $APK → s3://$R2_BUCKET/$KEY"
          # 版本化文件名内容不可变 → 长 cache；同版本重发（--force 覆盖）
          # 场景下 CDN 可能短暂返回旧缓存，可接受（同版本内容应一致）
          aws s3 cp "$APK" "s3://$R2_BUCKET/$KEY" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/vnd.android.package-archive"
          # 自检：远端对象大小与本地一致，防止静默截断的半截 APK
          # 进入更新链（下载端表现为安装包解析失败，难排查）
          REMOTE_SIZE=$(aws s3api head-object --bucket "$R2_BUCKET" \
            --key "$KEY" --endpoint-url "$R2_ENDPOINT" \
            --query 'ContentLength' --output text)
          LOCAL_SIZE=$(stat -c%s "$APK")
          if [ "$REMOTE_SIZE" != "$LOCAL_SIZE" ]; then
            echo "::error ::R2 对象大小不一致 remote=$REMOTE_SIZE local=$LOCAL_SIZE"
            exit 1
          fi
          echo "R2 上传与校验通过：$KEY（$LOCAL_SIZE 字节）"

      - name: Publish update manifest to R2
        # 清单最后写（原子切换点，见上方顺序约束说明）。缓存策略必须是
        # no-cache：清单每次发版都变，若被 CDN 缓存，部分用户会延迟
        # 收到更新（APK 是版本化文件名可以长 cache，清单不行）。
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          set -e
          VN=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          TAG="v$VN"
          APK=build/app/outputs/flutter-apk/app-release.apk
          APK_URL="$R2_PUBLIC_BASE/orion/orion-agent-v$VN.apk"
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          # 更新说明与 Release 正文同源（顶部当前版本段落，提取逻辑一致）
          awk -v ver="$TAG" 'BEGIN{p=0} /^# Orion Agent /{if(p)exit; if(index($0,ver)>0)p=1} p' \
            RELEASE_NOTES.md > /tmp/rel_notes.md
          test -s /tmp/rel_notes.md || cp RELEASE_NOTES.md /tmp/rel_notes.md
          export VN APK_URL APK_SHA BUILD_NUM="$GITHUB_RUN_NUMBER"
          # JSON 用 python 生成：notes 是多行中文文本，shell 手拼 JSON
          # 转义必出错（引号/换行），json.dumps 一次搞定
          python3 - <<'PY'
          import json, os
          manifest = {
              'version': os.environ['VN'],
              'apkUrl': os.environ['APK_URL'],
              'notes': open('/tmp/rel_notes.md', encoding='utf-8').read().strip(),
              'buildNumber': int(os.environ['BUILD_NUM']),
              'sha256': os.environ['APK_SHA'],
          }
          with open('/tmp/latest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(open('/tmp/latest.json', encoding='utf-8').read())
          PY
          aws s3 cp /tmp/latest.json "s3://$R2_BUCKET/orion/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-cache" \
            --content-type "application/json"
          echo "更新清单已发布：$APK_URL（sha256=$APK_SHA）"

      - name: Cleanup old R2 APKs (keep latest 2)
        # 清理判断逻辑（python 逐段数字排序，与 Dart 端 isNewer 同规则）：
        #   1. ListObjectsV2 列出 orion/ 前缀下全部对象
        #   2. 只取匹配 orion/orion-agent-v<X.Y.Z>.apk 的 .apk，
        #      版本号从文件名解析为整数元组（补齐段数）后降序排序
        #   3. 保留最新 KEEP 个（默认 2：当前版 + 上一版回滚位），
        #      其余走 DeleteObjects 逐个删除
        #   4. 不匹配命名模式的对象（含 latest.json）一律不动——
        #      来历不明的文件不自动删，需要人工处理
        # 执行时机：每次正式发布（main push）的清单发布成功之后。
        # 用 continue-on-error：清理失败只是多占空间，绝不能让已
        # 成功的发布整体标红/触发重试。
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          # 每次发布清到只剩 2 个，总量恒小；ListObjectsV2 单页上限
          # 1000，当前量级无需翻页（注释留存：若未来有历史积压，
          # 先手工清一次再让本步骤接管增量）
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" \
            --prefix "orion/" --endpoint-url "$R2_ENDPOINT" \
            --output json > /tmp/objects.json
          export KEEP=2
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          data = json.load(open('/tmp/objects.json'))
          objs = data.get('Contents') or []
          pat = re.compile(r'^orion/orion-agent-v(\d+(?:\.\d+)*)\.apk$')
          cands = []
          for o in objs:
              m = pat.match(o['Key'])
              if m:
                  ver = tuple(int(x) for x in m.group(1).split('.'))
                  cands.append((ver, o['Key']))
          cands.sort(reverse=True)
          keep = int(os.environ['KEEP'])
          stale = [k for _, k in cands[keep:]]
          skipped = len(objs) - len(cands)
          if not stale:
              print(f'R2 正式版 APK 共 {len(cands)} 个，未超过保留数 {keep}，无需清理')
              sys.exit(0)
          for _, k in cands[:keep]:
              print(f'保留 {k}')
          endpoint = os.environ['R2_ENDPOINT']
          bucket = os.environ['R2_BUCKET']
          for k in stale:
              print(f'删除旧版本 {k}')
              subprocess.run(
                  ['aws', 's3api', 'delete-objects', '--bucket', bucket,
                   '--endpoint-url', endpoint,
                   '--delete', json.dumps({'Objects': [{'Key': k}]}),
                   '--output', 'text'],
                  check=True)
          print(f'清理完成：删除 {len(stale)} 个，'
                f'保留最新 {min(keep, len(cands))} 个，'
                f'跳过非 APK 对象 {skipped} 个')
          PY
